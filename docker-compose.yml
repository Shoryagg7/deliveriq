# Shared app environment. Every service built from this repo imports
# app.core.config at import time, and JWT_SECRET has no default (G04) — so all
# of them need it, `migrate` included, because alembic/env.py imports
# app.core.database. One anchor instead of five copies: a secret that has to be
# pasted five times is a secret that ends up wrong in one of them.
#
# `:?` makes Compose itself refuse to start when JWT_SECRET is unset, rather
# than passing an empty string down to a container that then fails to boot with
# a stack trace nobody reads.
x-app-env: &app-env
  DATABASE_URL: postgresql://deliveriq_user:password@db:5432/deliveriq_db
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
  # Togglable so a load run can measure the APP rather than the limiter:
  #   RATE_LIMIT_ENABLED=false docker compose up -d
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: deliveriq_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deliveriq_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro   # ← added
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveriq_user -d deliveriq_db"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  # --- Kafka: THREE brokers, RF=3, min.insync.replicas=2 -------------------
  # One broker with RF=1 made `acks=all` durability theatre — "all" was one
  # replica, so a single disk loss lost the log. The producer config was always
  # correct; the topology was not. Now `acks=all` means two replicas must
  # confirm before a write is acknowledged, so one broker can die with no loss
  # and no unavailability.
  #
  # RF=3 with min.insync.replicas=2 is the standard pairing: it tolerates one
  # broker down and still accepts writes. min.insync=3 would refuse writes the
  # moment any broker blinked; min.insync=1 would silently accept a write only
  # one replica has, which is the theatre again.
  kafka-1: &kafka-broker
    image: apache/kafka:4.1.2
    ports:
      - "9092:9092"
    environment: &kafka-env
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # All three are controllers — a 3-node quorum tolerates one failure.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Internal topics get real replication too — a consumer group whose
      # offsets live on one broker loses its place when that broker dies.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka1data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-2:
    <<: *kafka-broker
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:9094
    volumes:
      - kafka2data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-3:
    <<: *kafka-broker
    ports:
      - "9095:9095"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9095,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:9095
    volumes:
      - kafka3data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9095 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.2
    command: >
      sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092
      --create --if-not-exists --topic order.dispatched
      --partitions 3 --replication-factor 3
      --config min.insync.replicas=2 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092
      --create --if-not-exists --topic order.dispatched.dlq
      --partitions 3 --replication-factor 3
      --config min.insync.replicas=2
      "
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: deliveriq-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka-1
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # A RANGE, not a fixed port. `--scale api=3` needs three free host ports; a
    # plain "8000:8000" makes the 2nd replica die on "port is already allocated".
    # With one replica this still binds 8000, so nothing changes day to day.
    ports:
      - "${API_PORTS:-8000-8002:8000}"
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka-init:                                               # ← changed: was `kafka: service_started`
        condition: service_completed_successfully

  # --- Day 33: three groups, one topic, independent offsets -----------------
  # Identical wiring; only the module (and so the group.id) differs. Each is a
  # managed worker now, not a `python -m` in a spare terminal — which is why the
  # SIGTERM handler matters: `docker compose stop` sends SIGTERM, and without it
  # every restart stalls ~45s waiting out session.timeout.ms.
  notification-worker:
    build: .
    command: python -m app.workers.notification_consumer
    environment:
      <<: *app-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The other half of the transactional outbox. Dispatch writes the event as a
  # row inside its own transaction; this publishes it and marks it done. It is
  # the ONLY producer on the dispatch path now.
  outbox-relay:
    build: .
    command: python -m app.workers.outbox_relay
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  analytics-worker:
    build: .
    command: python -m app.workers.analytics_consumer
    environment:
      <<: *app-env
    depends_on:
      migrate:                       # writes to dispatch_events → needs schema
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  audit-worker:
    build: .
    command: python -m app.workers.audit_consumer
    environment:
      # Inherits the shared block even though this worker never touches Postgres
      # or Redis: Settings is one global object, so every process must satisfy
      # every required field or fail at import. Per-process config classes would
      # fix that; noted, not done.
      <<: *app-env
      AUDIT_LOG_PATH: /var/log/deliveriq/audit.log
    volumes:
      - auditdata:/var/log/deliveriq
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Days 36-37: observability -------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local demo only. Anonymous viewing means a screenshot or a screen-share
      # doesn't start with a login prompt.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      # Provisioned from the repo, so `down -v` cannot lose the dashboard.
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  kafka1data:
  kafka2data:
  kafka3data:
  auditdata:
  promdata:
  grafanadata:
