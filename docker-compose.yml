services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: deliveriq_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deliveriq_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro   # ← added
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveriq_user -d deliveriq_db"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:                                                # ← added
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  kafka-init:                                                   # ← added (one-shot, mirrors `migrate`)
    image: apache/kafka:4.1.2
    command: >
      sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
      --create --if-not-exists --topic order.dispatched
      --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
      --create --if-not-exists --topic order.dispatched.dlq
      --partitions 3 --replication-factor 1
      "
    depends_on:
      kafka:
        condition: service_healthy
  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: deliveriq-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://deliveriq_user:password@db:5432/deliveriq_db
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # A RANGE, not a fixed port. `--scale api=3` needs three free host ports; a
    # plain "8000:8000" makes the 2nd replica die on "port is already allocated".
    # With one replica this still binds 8000, so nothing changes day to day.
    ports:
      - "${API_PORTS:-8000-8002:8000}"
    environment:
      DATABASE_URL: postgresql://deliveriq_user:password@db:5432/deliveriq_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka-init:                                               # ← changed: was `kafka: service_started`
        condition: service_completed_successfully

  # --- Day 33: three groups, one topic, independent offsets -----------------
  # Identical wiring; only the module (and so the group.id) differs. Each is a
  # managed worker now, not a `python -m` in a spare terminal — which is why the
  # SIGTERM handler matters: `docker compose stop` sends SIGTERM, and without it
  # every restart stalls ~45s waiting out session.timeout.ms.
  notification-worker:
    build: .
    command: python -m app.workers.notification_consumer
    environment:
      DATABASE_URL: postgresql://deliveriq_user:password@db:5432/deliveriq_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  analytics-worker:
    build: .
    command: python -m app.workers.analytics_consumer
    environment:
      DATABASE_URL: postgresql://deliveriq_user:password@db:5432/deliveriq_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      migrate:                       # writes to dispatch_events → needs schema
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  audit-worker:
    build: .
    command: python -m app.workers.audit_consumer
    environment:
      # This worker never touches Postgres, but Settings is one global object
      # with database_url required — so every process must supply it or fail at
      # import. Per-process config classes would fix that; noted, not done.
      DATABASE_URL: postgresql://deliveriq_user:password@db:5432/deliveriq_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:19092
      AUDIT_LOG_PATH: /var/log/deliveriq/audit.log
    volumes:
      - auditdata:/var/log/deliveriq
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Days 36-37: observability -------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local demo only. Anonymous viewing means a screenshot or a screen-share
      # doesn't start with a login prompt.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      # Provisioned from the repo, so `down -v` cannot lose the dashboard.
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  kafkadata:
  auditdata:
  promdata:
  grafanadata:
