# Scrape config. 5s is aggressive for production (15-30s is normal) but makes a
# live demo readable — a dashboard that updates twice a minute looks broken.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # DNS discovery, not a static target. Compose registers every replica of `api`
  # under the same name, so "api:8000" as a static target is ONE series that
  # Docker's round-robin points at a different replica each scrape — three
  # independent counters collapsed into one, which reads as constant resets and
  # makes rate() meaningless. Type A discovery returns every replica as its own
  # target with its own `instance` label, and the dashboard's sum() adds them up.
  - job_name: deliveriq-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 5s
    relabel_configs:
      - target_label: service
        replacement: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
