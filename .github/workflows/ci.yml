name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you re-run from the Actions tab without a push

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that is already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Postgres + Redis + Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Job-level, not step-level. JWT_SECRET has no default (G04), so every
    # process that imports app.core.config needs it — and docker-compose.yml
    # interpolates `${JWT_SECRET:?}` when the FILE is parsed, so even
    # `docker compose up db` fails without it. A CI-only throwaway value: it
    # signs nothing that outlives the run, but it must still clear the length
    # and placeholder checks the app enforces.
    env:
      JWT_SECRET: ci-only-not-a-real-secret-do-not-reuse-anywhere-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.0   # pinned: an unpinned linter fails builds that changed nothing

      # Infra comes from the REAL docker-compose.yml, not a parallel CI-only
      # description of it. GitHub's `services:` block would mean maintaining two
      # definitions of the same stack, and they drift — CI eventually goes green
      # against a Kafka configured differently from the one that actually runs.
      # This way a broken compose file fails CI instead of surfacing at deploy.
      - name: Start infrastructure
        run: |
          docker compose up -d db redis kafka-1 kafka-2 kafka-3
          docker compose ps

      # kafka-init is gated on the broker healthcheck and exits 0 only once the
      # topics exist, so "did the broker come up?" needs no sleep-and-hope.
      - name: Wait for Postgres and create topics
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U deliveriq_user -d deliveriq_db && break
            sleep 2
          done
          docker compose up kafka-init --exit-code-from kafka-init

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://deliveriq_user:password@localhost:5433/deliveriq_db
        run: alembic upgrade head

      - name: Lint
        run: ruff check app tests scripts

      # Host-side pytest against containerised infra — the same hybrid setup
      # used locally, so a green CI run means the local workflow genuinely works.
      - name: Run tests
        env:
          DATABASE_URL: postgresql://deliveriq_user:password@localhost:5433/deliveriq_test_db
          REDIS_URL: redis://localhost:6379/15
          KAFKA_BOOTSTRAP: localhost:9092
        run: pytest tests/ -q

      # Runs even when tests fail — the logs are the whole point when they do.
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The project's headline correctness claim — no double-dispatch across
  # replicas — was proved by a script somebody had to remember to run. That is
  # not regression protection. It runs here now, against three real replicas.
  race:
    name: Concurrency proof (3 replicas)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JWT_SECRET: ci-only-not-a-real-secret-do-not-reuse-anywhere-0123456789
      # A range would let Docker pick arbitrary ports; race_test.py expects
      # exactly 8000-8002, one per replica.
      API_PORTS: 8000-8002:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install httpx
        run: pip install httpx

      - name: Start the stack with 3 API replicas
        run: |
          docker compose up -d --build --scale api=3
          docker compose ps

      - name: Wait for all three replicas
        run: |
          for port in 8000 8001 8002; do
            for i in $(seq 1 60); do
              curl -sf "http://localhost:$port/health" >/dev/null && break
              sleep 3
            done
            curl -sf "http://localhost:$port/health" >/dev/null \
              || { echo "replica on $port never became healthy"; exit 1; }
          done

      - name: Seed the ops login the script authenticates with
        run: docker compose exec -T api python -m scripts.seed_users

      # Asserts every assigned order_id AND rider_id is unique across 15
      # simultaneous dispatches. Exits non-zero on any duplicate.
      - name: Race test
        run: python -m scripts.race_test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
